<!DOCTYPE html>
<html>
<head>
    <title>House Price Predictor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>House Price Predictor</h1>
        <p>Enter the size of the house (in square feet) to estimate its price:</p>
        
        <form id="prediction-form" method="post" action="/predict">
            <input type="number" id="size" name="size" placeholder="e.g., 1200" required>
            <button type="submit">Predict Price</button>
        </form>
        
        <div id="result"></div>
    </div>

    <script>
        document.getElementById('prediction-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const size = formData.get('size');
            
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `size=${size}`
            });
            
            const data = await response.json();
            document.getElementById('result').innerHTML = `
                <h3>Estimated Price: $${data.price} thousand</h3>
            `;
        });
    </script>
</body>
</html>
